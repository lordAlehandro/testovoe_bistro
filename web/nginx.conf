server {
  listen 80;
  root /usr/share/nginx/html;

  # Сжатие ответов: бандл и JSON уменьшаются в 3–4 раза.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Запросы к API — на сервер.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # Файлы сборки с хэшем в имени не меняются — кэшируем надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Приложение одностраничное: любой путь (/citizens/…) отдаём index.html, дальше разберётся роутер.
  location / {
    try_files $uri /index.html;
  }
}
